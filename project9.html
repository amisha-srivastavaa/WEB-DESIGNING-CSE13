<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGear | Premium Hardware</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css9.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Tech<span>Gear</span></div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li class="cart-icon">🛒 <span>2</span></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Elevate Your Setup</h1>
            <p>Precision-engineered tools for the modern developer.</p>
            <button class="cta-btn">Shop Now</button>
        </div>
    </section>

    <main id="products">
        <h2 class="section-title">Featured Gear</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="badge">New</div>
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?q=80&w=400" alt="Keyboard">
                </div>
                <h3>Cyber-Mechanical Keyboard</h3>
                <p>RGB Backlit • Blue Switches</p>
                <div class="card-footer">
                    <span class="price">₹5,499</span>
                    <button class="add-btn">Add</button>
                </div>
            </div>

            <div class="product-card">
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?q=80&w=400" alt="Monitor">
                </div>
                <h3>Ultrawide 4K Monitor</h3>
                <p>144Hz • HDR10 Support</p>
                <div class="card-footer">
                    <span class="price">₹32,999</span>
                    <button class="add-btn">Add</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
