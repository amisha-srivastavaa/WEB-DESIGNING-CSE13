<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Result Table</title>
    <link rel="stylesheet" href="extcss.css">
</head>
<body>

    <table>
        <caption>Annual Examination Result - 2026</caption>
        <thead>
            <tr>
                <th rowspan="2">Student Name</th>
                <th rowspan="2">Roll No.</th>
                <th colspan="3">Subjects</th>
                <th rowspan="2">Total Marks</th>
            </tr>
            <tr>
                <th>Maths</th>
                <th>Science</th>
                <th>English</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Arjun Sharma</td>
                <td>101</td>
                <td>85</td>
                <td>90</td>
                <td>82</td>
                <td>257</td>
            </tr>
            <tr>
                <td>Sanya Verma</td>
                <td>102</td>
                <td>92</td>
                <td>88</td>
                <td>95</td>
                <td>275</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2"><strong>Class Average</strong></td>
                <td>88.5</td>
                <td>89</td>
                <td>88.5</td>
                <td>266</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
